<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300">
<defs><style>
.bg{fill:#080c12}.panel{fill:#0b1017;stroke:#303945;stroke-width:1.2}.btn{fill:#202833;stroke:#3b4652}.li{fill:#1683d8}.gh{fill:#30343a}.g{fill:#8ee7a3}.w{fill:#e8edf2}.d{fill:#9aa3ad}.cyan{fill:#69d5ff}.s{font:14px Arial,sans-serif}.b{font:bold 15px Arial,sans-serif}.h{font:bold 19px Arial,sans-serif}
@keyframes scan{0%{transform:translateY(0);opacity:.02}50%{opacity:.35}100%{transform:translateY(250px);opacity:.02}}@keyframes pulse{50%{opacity:.35}}@keyframes glow{50%{filter:drop-shadow(0 0 7px #1683d8)}}@keyframes glowg{50%{filter:drop-shadow(0 0 7px #35ff73)}}@keyframes blink{50%{opacity:.1}}@keyframes up{50%{transform:translateY(-2px)}}
.scan{animation:scan 5s linear infinite}.halo{animation:pulse 2.8s ease-in-out infinite}.linkedin{animation:glow 2.2s ease-in-out infinite}.github{animation:glowg 2.4s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}.tag{animation:up 2.5s ease-in-out infinite}
</style><radialGradient id="halo"><stop stop-color="#35ff73" stop-opacity=".1"/><stop offset="1" stop-color="#35ff73" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter></defs>
<rect width="1100" height="300" rx="14" class="bg"/>
