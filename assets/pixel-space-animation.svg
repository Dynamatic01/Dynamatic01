<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="286" viewBox="0 0 1100 286">
<defs>
<style>
.bg{fill:#070b12}.px{shape-rendering:crispEdges}.green{fill:#16a34a}.bright{fill:#35ff73}.dark{fill:#0b6b35}.yellow{fill:#f5d21f}.blue{fill:#3b82f6}.star{fill:#d9e3ec}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes shot{0%{transform:translateY(-12px);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateY(205px);opacity:0}}
@keyframes ship{0%,100%{transform:translateX(-5px)}50%{transform:translateX(32px)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.alien{animation:drift 3s ease-in-out infinite}.a2{animation-delay:.25s}.a3{animation-delay:.5s}.a4{animation-delay:.75s}.a5{animation-delay:1s}
.glow{animation:pulse 1.8s ease-in-out infinite}.shot{animation:shot 1.7s linear infinite}.shot2{animation:shot 1.7s .7s linear infinite}.ship{animation:ship 2.2s ease-in-out infinite}
.s1{animation:twinkle 1.8s infinite}.s2{animation:twinkle 2.4s .4s infinite}.s3{animation:twinkle 2.1s .8s infinite}
</style>
</defs>
<rect width="1100" height="286" rx="16" class="bg"/>
<!-- stars -->
<g class="px">
<rect x="52" y="34" width="3" height="3" class="star s1"/><rect x="143" y="79" width="2" height="2" class="star s2"/>
