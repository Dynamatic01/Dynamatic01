<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300">
<defs>
<style>
.bg{fill:#080c12}.panel{fill:#0b1017;stroke:#26303c;stroke-width:1.2}.g{fill:#ff6548}.w{fill:#d7dce2}.d{fill:#9aa3ad}.orange{fill:#ff6548}.blue{fill:#3572A5}.yellow{fill:#f1e05a}.purple{fill:#89569c}.red{fill:#e34c26}.cyan{fill:#4c9be8}.s{font:14px Arial,sans-serif}.b{font:bold 17px Arial,sans-serif}.h{font:bold 19px Arial,sans-serif}
@keyframes scan{0%{transform:translateY(0);opacity:.03}50%{opacity:.3}100%{transform:translateY(250px);opacity:.03}}
@keyframes pulse{50%{opacity:.35}}@keyframes ring{0%{stroke-dashoffset:220}70%{stroke-dashoffset:40}100%{stroke-dashoffset:220}}
@keyframes bar1{from{width:40px}to{width:230px}}@keyframes bar2{from{width:35px}to{width:87px}}@keyframes bar3{from{width:30px}to{width:80px}}@keyframes bar4{from{width:18px}to{width:58px}}@keyframes bar5{from{width:8px}to{width:20px}}
@keyframes blink{50%{opacity:.15}}@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.scan{animation:scan 5s linear infinite}.halo{animation:pulse 2.8s ease-in-out infinite}.ring{stroke-dasharray:220;animation:ring 3s ease-in-out infinite}.bar1{animation:bar1 2s ease-in-out infinite alternate}.bar2{animation:bar2 2.2s ease-in-out infinite alternate}.bar3{animation:bar3 2.4s ease-in-out infinite alternate}.bar4{animation:bar4 2.6s ease-in-out infinite alternate}.bar5{animation:bar5 2.8s ease-in-out infinite alternate}.blink{animation:blink 1s steps(2,end) infinite}.fade{animation:fade .8s ease-out}
</style>
<radialGradient id="glow"><stop stop-color="#ff6548" stop-opacity=".12"/><stop offset="1" stop-color="#ff6548" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#151c25"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

<rect width="1100" height="300" rx="16" class="bg"/>
<rect x="18" y="18" width="1064" height="264" rx="12" fill="url(#grid)" opacity=".35"/>
<rect x="28" y="28" width="1044" height="244" rx="8" class="panel"/>
<ellipse cx="760" cy="150" rx="330" ry="130" fill="url(#glow)" filter="url(#blur)" class="halo"/>

<text x="50" y="62" class="h w">06 / GITHUB</text>
<line x1="50" y1="76" x2="1050" y2="76" stroke="#303945"/>

<!-- LEFT -->
<text x="110" y="112" class="b g">Mohit's GitHub Stats</text>
<g class="fade">
<text x="110" y="139" class="s w">☆</text><text x="132" y="139" class="s w">Total Stars Earned:</text><text x="390" y="139" class="s w">11</text>
<text x="110" y="161" class="s g">◔</text><text x="132" y="161" class="s w">Total Commits (last year):</text><text x="390" y="161" class="s w">306</text>
<text x="110" y="183" class="s g">♆</text><text x="132" y="183" class="s w">Total PRs:</text><text x="390" y="183" class="s w">0</text>
<text x="110" y="205" class="s g">ⓘ</text><text x="132" y="205" class="s w">Total Issues:</text><text x="390" y="205" class="s w">0</text>
<text x="110" y="227" class="s g">▣</text><text x="132" y="227" class="s w">Contributed to (last year):</text><text x="390" y="227" class="s w">0</text>
</g>

<!-- RANK RING -->
<circle cx="500" cy="166" r="37" fill="none" stroke="#4b2b26" stroke-width="6"/>
<circle cx="500" cy="166" r="37" fill="none" stroke="#ff6548" stroke-width="6" stroke-linecap="round" transform="rotate(-90 500 166)" class="ring"/>
<text x="500" y="173" text-anchor="middle" class="b w">C+</text>

<!-- RIGHT -->
<text x="625" y="112" class="b g">Most Used Languages</text>
<rect x="625" y="126" width="430" height="9" rx="4" fill="#1c2a25"/>
<rect x="625" y="126" width="230" height="9" rx="4" fill="#e34c26" class="bar1"/>
<rect x="855" y="126" width="87" height="9" rx="4" fill="#f37626" class="bar2"/>
<rect x="942" y="126" width="80" height="9" rx="4" fill="#f1e05a" class="bar3"/>
<rect x="1022" y="126" width="33" height="9" rx="4" fill="#3572A5" class="bar4"/>

<circle cx="630" cy="159" r="5" fill="#e34c26"/><text x="643" y="164" class="s w">HTML 50.73%</text>
<circle cx="630" cy="184" r="5" fill="#f37626"/><text x="643" y="189" class="s w">Jupyter Notebook 19.09%</text>
<circle cx="630" cy="209" r="5" fill="#f1e05a"/><text x="643" y="214" class="s w">JavaScript 17.50%</text>

<circle cx="800" cy="159" r="5" fill="#3572A5"/><text x="813" y="164" class="s w">Python 12.30%</text>
<circle cx="800" cy="184" r="5" fill="#89569c"/><text x="813" y="189" class="s w">CSS 0.38%</text>

<rect x="45" y="84" width="1010" height="2" fill="#ff6548" class="scan"/>
<text x="1038" y="252" text-anchor="end" class="s d">github.com/Dynamatic01 <tspan class="blink g">█</tspan></text>
</svg>