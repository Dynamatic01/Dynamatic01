.bg{fill:#050b07}.panel{fill:#07130b;stroke:#1cff62;stroke-width:1.5}.card{fill:#040a06;stroke:#155d2c}.g{fill:#35ff73}.w{fill:#d9f6df}.d{fill:#6fa77f}.s{font:15px monospace}.m{font:19px monospace}.h{font:bold 28px monospace}
