name: Update GitHub Contribution Animation

on:
  push:
    paths-ignore:
      - "assets/github-contribution-grid-snake.svg"
      - "assets/github-contribution-grid-snake.gif"
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: Dynamatic01
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake.gif

      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.gif
          if git diff --cached --quiet; then
            echo "No contribution changes."
          else
            git commit -m "chore: update GitHub contribution animation"
            git push
          fi
