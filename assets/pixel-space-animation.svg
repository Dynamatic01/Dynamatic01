<rect x="462" y="162" width="2" height="2" class="star s3"/><rect x="690" y="174" width="3" height="3" class="star s2"/>
<rect x="895" y="158" width="2" height="2" class="star s1"/><rect x="1014" y="191" width="3" height="3" class="star s3"/>
</g>
