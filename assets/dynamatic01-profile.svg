<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040" role="img" aria-labelledby="title desc">
<title id="title">Dynamatic01 animated GitHub profile</title>
<desc id="desc">Neon green animated terminal profile, projects list and language stack for Mohit.</desc>
<style>
.bg{fill:#050b07}.panel{fill:#07130b;stroke:#1cff62;stroke-width:1.5}.inner{fill:#040a06;stroke:#155d2c}.dim{fill:#6fa77f}.green{fill:#35ff73}.white{fill:#d9f6df}.line{stroke:#1cff62;fill:none}.small{font:12px monospace}.med{font:16px monospace}.big{font:bold 34px monospace}.title{font:bold 23px monospace}.blink{animation:blink 1s steps(2,end) infinite}.scan{animation:scan 4s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.bar1{animation:bar1 2.2s ease-out infinite alternate}.bar2{animation:bar2 2.4s ease-out infinite alternate}.bar3{animation:bar3 2.6s ease-out infinite alternate}.bar4{animation:bar4 2.8s ease-out infinite alternate}.bar5{animation:bar5 3s ease-out infinite alternate}@keyframes blink{50%{opacity:.15}}@keyframes scan{0%{transform:translateY(0);opacity:.08}50%{opacity:.65}100%{transform:translateY(500px);opacity:.08}}@keyframes pulse{50%{opacity:.35}}@keyframes bar1{from{width:180px}to{width:270px}}@keyframes bar2{from{width:80px}to{width:125px}}@keyframes bar3{from{width:70px}to{width:115px}}@keyframes bar4{from{width:45px}to{width:80px}}@keyframes bar5{from{width:20px}to{width:35px}}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0e2a17" stroke-width="1"/></pattern>
