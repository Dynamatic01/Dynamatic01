<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<defs>
<style>
.bg{fill:#050b07}.panel{fill:#07130b;stroke:#1cff62;stroke-width:1.5}.g{fill:#35ff73}.w{fill:#e5f9e9}.d{fill:#83ae8e}.s{font:17px monospace}.h{font:bold 30px monospace}.label{font:bold 15px monospace}
@keyframes scan{0%{transform:translateY(0);opacity:.03}50%{opacity:.5}100%{transform:translateY(370px);opacity:.03}}
@keyframes blink{50%{opacity:.1}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-2px)}}
.scan{animation:scan 5s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 3s ease-in-out infinite}
</style>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#0e2a17"/></pattern>
<radialGradient id="halo"><stop stop-color="#16ff62" stop-opacity=".16"/><stop offset="1" stop-color="#16ff62" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="1100" height="430" rx="22" class="bg"/>
<rect x="18" y="18" width="1064" height="394" rx="18" fill="url(#grid)"/>
<ellipse cx="850" cy="220" rx="350" ry="210" fill="url(#halo)" filter="url(#blur)" class="pulse"/>
<rect x="28" y="28" width="1044" height="374" rx="12" class="panel"/>

<text x="58" y="72" class="h g">01 / ABOUT</text>
<text x="1040" y="72" text-anchor="end" class="label g">&gt; about.scan</text>
<line x1="55" y1="91" x2="1045" y2="91" stroke="#155d2c" stroke-width="2"/>

<text x="58" y="130" class="s w">Hi, I'm <tspan class="g" font-weight="bold">Mohit Mehta</tspan>, a Computer Science Engineering student</text>
<text x="58" y="158" class="s w">focused on <tspan class="g" font-weight="bold">Data Analytics and Business Intelligence.</tspan></text>

<text x="58" y="201" class="s d">I work with data from collection and cleaning through SQL analysis,</text>
<text x="58" y="229" class="s d">transformation, visualization, and dashboard storytelling.</text>

<text x="58" y="270" class="label g">TECH STACK</text>

<g class="float">
<rect x="58" y="288" width="105" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="110" y="311" text-anchor="middle" class="label w">Python</text>
<rect x="175" y="288" width="82" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="216" y="311" text-anchor="middle" class="label w">SQL</text>
<rect x="269" y="288" width="91" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="314" y="311" text-anchor="middle" class="label w">Excel</text>
<rect x="372" y="288" width="116" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="430" y="311" text-anchor="middle" class="label w">Power BI</text>
<rect x="500" y="288" width="98" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="549" y="311" text-anchor="middle" class="label w">MySQL</text>
<rect x="610" y="288" width="105" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="662" y="311" text-anchor="middle" class="label w">Pandas</text>
<rect x="727" y="288" width="82" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="768" y="311" text-anchor="middle" class="label w">DAX</text>
<rect x="821" y="288" width="137" height="34" rx="17" fill="#0a2111" stroke="#1b7137"/>
<text x="889" y="311" text-anchor="middle" class="label w">Power Query</text>
</g>

<text x="58" y="357" class="s d">Currently building practical analytics projects and strengthening my skills</text>
<text x="58" y="384" class="s d">for <tspan class="g" font-weight="bold">Data Analyst / BI internship opportunities.</tspan><tspan class="blink g"> █</tspan></text>

<rect x="45" y="102" width="1010" height="3" fill="#35ff73" class="scan"/>
</svg>