<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410">
<defs>
<style>
.bg{fill:#050b07}.panel{fill:#07130b;stroke:#1cff62;stroke-width:1.5}.row{fill:#040a06;stroke:#155d2c}.g{fill:#35ff73}.w{fill:#e5f9e9}.d{fill:#83ae8e}.s{font:16px monospace}.h{font:bold 30px monospace}.label{font:bold 16px monospace}
@keyframes scan{0%{transform:translateY(0);opacity:.03}50%{opacity:.55}100%{transform:translateY(350px);opacity:.03}}
@keyframes glow{50%{opacity:.35}}@keyframes blink{50%{opacity:.1}}@keyframes slide{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.scan{animation:scan 5s linear infinite}.pulse{animation:glow 2.8s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}.r1{animation:slide .7s ease-out}.r2{animation:slide .9s ease-out}.r3{animation:slide 1.1s ease-out}.r4{animation:slide 1.3s ease-out}.r5{animation:slide 1.5s ease-out}
</style>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#0e2a17"/></pattern>
<radialGradient id="halo"><stop stop-color="#16ff62" stop-opacity=".15"/><stop offset="1" stop-color="#16ff62" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
</defs>

<rect width="1100" height="410" rx="22" class="bg"/>
<rect x="18" y="18" width="1064" height="374" rx="18" fill="url(#grid)"/>
<ellipse cx="850" cy="205" rx="350" ry="220" fill="url(#halo)" filter="url(#blur)" class="pulse"/>
<rect x="28" y="28" width="1044" height="354" rx="12" class="panel"/>

<text x="58" y="72" class="h g">02 / CORE STACK</text>
<text x="1040" y="72" text-anchor="end" class="label g">&gt; stack.scan</text>
<line x1="55" y1="91" x2="1045" y2="91" stroke="#155d2c" stroke-width="2"/>

<!-- Row 1 -->
<g class="r1"><rect x="50" y="108" width="1000" height="46" rx="7" class="row"/>
<text x="70" y="137" class="label g">DATA ANALYSIS</text>
<text x="310" y="137" class="s w">Python</text><text x="390" y="137" class="g">•</text><text x="415" y="137" class="s w">Pandas</text><text x="495" y="137" class="g">•</text><text x="520" y="137" class="s w">NumPy</text></g>

<!-- Row 2 -->
<g class="r2"><rect x="50" y="163" width="1000" height="46" rx="7" class="row"/>
<text x="70" y="192" class="label g">DATABASES</text>
<text x="310" y="192" class="s w">MySQL</text><text x="390" y="192" class="g">•</text><text x="415" y="192" class="s w">SQL</text></g>

<!-- Row 3 -->
<g class="r3"><rect x="50" y="218" width="1000" height="46" rx="7" class="row"/>
<text x="70" y="247" class="label g">BI &amp; VISUALIZATION</text>
<text x="310" y="247" class="s w">Power BI</text><text x="405" y="247" class="g">•</text><text x="430" y="247" class="s w">DAX</text><text x="485" y="247" class="g">•</text><text x="510" y="247" class="s w">Power Query</text></g>

<!-- Row 4 -->
<g class="r4"><rect x="50" y="273" width="1000" height="46" rx="7" class="row"/>
<text x="70" y="302" class="label g">SPREADSHEET ANALYTICS</text>
<text x="365" y="302" class="s w">Microsoft Excel</text><text x="510" y="302" class="g">•</text><text x="535" y="302" class="s w">Pivot Tables</text><text x="655" y="302" class="g">•</text><text x="680" y="302" class="s w">XLOOKUP / VLOOKUP</text></g>

<!-- Row 5 -->
<g class="r5"><rect x="50" y="328" width="1000" height="46" rx="7" class="row"/>
<text x="70" y="357" class="label g">WORKFLOW</text>
<text x="310" y="357" class="s w">Git</text><text x="355" y="357" class="g">•</text><text x="380" y="357" class="s w">GitHub</text><text x="455" y="357" class="g">•</text><text x="480" y="357" class="s w">Jupyter Notebook</text></g>

<rect x="45" y="99" width="1010" height="3" fill="#35ff73" class="scan"/>
<text x="58" y="397" class="s d">root@dynamatic01:~$ stack --load --mode analytics <tspan class="blink g">█</tspan></text>
</svg>