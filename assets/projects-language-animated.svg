<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470">
<defs>
<style>
.bg{fill:#050b07}.panel{fill:#07130b;stroke:#1cff62;stroke-width:1.5}.card{fill:#040a06;stroke:#155d2c}.g{fill:#35ff73}.w{fill:#d9f6df}.d{fill:#6fa77f}.s{font:12px monospace}.m{font:16px monospace}.h{font:bold 24px monospace}
@keyframes scan{0%{transform:translateY(0);opacity:.05}50%{opacity:.6}100%{transform:translateY(400px);opacity:.05}}
@keyframes pulse{50%{opacity:.25}}
@keyframes blink{50%{opacity:.1}}
@keyframes grow1{from{width:40px}to{width:270px}} @keyframes grow2{from{width:40px}to{width:101px}} @keyframes grow3{from{width:40px}to{width:90px}} @keyframes grow4{from{width:40px}to{width:64px}} @keyframes grow5{from{width:40px}to{width:28px}}
@keyframes card{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.scan{animation:scan 4s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}.c1{animation:card 3s ease-in-out infinite}.c2{animation:card 3s .7s ease-in-out infinite}
.b1{animation:grow1 2s ease-in-out infinite alternate}.b2{animation:grow2 2.2s ease-in-out infinite alternate}.b3{animation:grow3 2.4s ease-in-out infinite alternate}.b4{animation:grow4 2.6s ease-in-out infinite alternate}.b5{animation:grow5 2.8s ease-in-out infinite alternate}
</style>
